name: Dune IMAX Wadala ticket alerts
on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches: [main]
    paths:
      - monitor.mjs
      - monitor.test.mjs
      - ticketnew.mjs
      - miraj.mjs
      - .github/workflows/monitor.yml
permissions:
  contents: write
concurrency:
  group: dune-imax-wadala-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test monitor.test.mjs
      - name: Check Dune English IMAX shows and notify
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node monitor.mjs
  fallback:
    needs: monitor
    if: ${{ always() && needs.monitor.result == 'failure' && github.event.repository.fork == false }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retry from Windows runner
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node monitor.mjs
